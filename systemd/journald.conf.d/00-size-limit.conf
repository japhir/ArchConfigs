# Without this, journald defaults to 10% of the filesystem. On a 20 GB root
# that is a 2 GB ceiling, which is a meaningful share of the free space on a
# partition that is already the binding constraint. 200 MB is still weeks of
# logs on a single-user laptop.
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=50M
MaxRetentionSec=1month
