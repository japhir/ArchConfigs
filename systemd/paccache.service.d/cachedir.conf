# The stock paccache.service ships with ProtectHome=yes, which mounts /home
# empty for the unit. Since CacheDir now lives at /home/pacman-cache, the stock
# timer would run successfully every week while cleaning nothing at all.
#
# ProtectHome=tmpfs keeps the rest of /home hidden from the unit; BindPaths is
# applied after the protective mount, exposing only the cache directory.
#
# ExecStart is cleared first because systemd appends otherwise. The path here
# must stay in sync with CacheDir in pacman.conf and with the -c flag in
# pacman.d/hooks/paccache-clean.hook.
[Service]
ProtectHome=tmpfs
BindPaths=/home/pacman-cache
ExecStart=
ExecStart=/usr/bin/paccache -rk2 -c /home/pacman-cache
